name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake-generator: Ninja
            is-web: false
          - os: windows-latest
            cmake-generator: Ninja
            is-web: false
          - os: macos-latest
            cmake-generator: Ninja
            is-web: false
          # --- ADDED WEB COMPILATION TARGET ---
          - os: ubuntu-latest
            cmake-generator: Ninja
            is-web: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (Linux/Web)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl ninja-build unzip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      # --- ADDED EMSCRIPTEN FOR WEB BUILD ---
      - name: Set up Emscripten SDK
        if: matrix.is-web == true
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64' # Standard Emscripten version used for Godot 4.3+ exports

      # --- SEPARATED WEB VS DESKTOP CONFIGURE STEP ---
      - name: Configure (Desktop)
        if: matrix.is-web == false
        run: cmake -B build -G "${{ matrix.cmake-generator }}"

      - name: Configure (Web)
        if: matrix.is-web == true
        run: |
          cmake -B build -G "${{ matrix.cmake-generator }}" \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # --- TEST EXCLUSION FOR WEB ---
      - name: Install Godot (Windows)
        if: runner.os == 'Windows' && matrix.is-web == false
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ARCHIVE: Godot_v4.7-stable_win64.exe.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}"
          unzip -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" -d "$RUNNER_TEMP/godot"

      - name: Run headless tests (Windows)
        if: runner.os == 'Windows' && matrix.is-web == false
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_win64.exe
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
          BUILD_DIR: ${{ github.workspace }}/build
        run: scripts/run_headless_tests.sh

      - name: Install Godot (Linux)
        if: runner.os == 'Linux' && matrix.is-web == false
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ZIP_NAME: Godot_v4.7-stable_linux.x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP_NAME}.zip"
          unzip -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_ZIP_NAME}"

      - name: Run headless tests (Linux)
        if: runner.os == 'Linux' && matrix.is-web == false
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_linux.x86_64
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
        run: scripts/run_headless_tests.sh

      - name: Publish test summary
        if: (runner.os == 'Linux' || runner.os == 'Windows') && matrix.is-web == false && always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/test-summary.md" ]]; then
            cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Tests did not run' >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- DIFFERENTIATED UPLOAD ARTIFACT FOR WEB ---
      - name: Upload artifact (Desktop)
        if: matrix.is-web == false
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-${{ runner.os }}
          path: bin/

      - name: Upload artifact (Web)
        if: matrix.is-web == true
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-Web
          path: bin/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: godot-box3d-*
          merge-multiple: true
          path: bin

      # --- PACKAGING ADJUSTED TO INCLUDE THE WASM SOURCE SIDE-MODULES ---
      - name: Assemble addon
        run: |
          mkdir -p addon/addons/godot-box3d/bin
          cp test_project/addons/godot-box3d/godot-box3d.gdextension addon/addons/godot-box3d/
          cp LICENSE addon/addons/godot-box3d/
          
          # Copy desktop components
          cp bin/libgodot-box3d.so bin/godot-box3d.dll bin/libgodot-box3d.dylib \
            addon/addons/godot-box3d/bin/ 2>/dev/null || true
            
          # Copy web component outputs explicitly if they exist
          cp bin/*web*.wasm addon/addons/godot-box3d/bin/ 2>/dev/null || true
          
          cd addon && zip -r ../godot-box3d-${{ github.ref_name }}.zip addons

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-box3d-${{ github.ref_name }}.zip
          generate_release_notes: true
